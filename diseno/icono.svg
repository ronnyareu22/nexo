<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26303F"/>
      <stop offset="1" stop-color="#0D1118"/>
    </linearGradient>
    <linearGradient id="canto" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#40CFFF"/>
      <stop offset="1" stop-color="#FFD700"/>
    </linearGradient>
    <radialGradient id="brillo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#40CFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#40CFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fondo con la forma de los íconos de macOS -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#fondo)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Halo -->
  <circle cx="512" cy="512" r="300" fill="url(#brillo)"/>

  <!-- Órbita -->
  <circle cx="512" cy="512" r="222" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="14"/>

  <!-- Líneas al núcleo -->
  <g stroke="url(#canto)" stroke-width="22" stroke-linecap="round" opacity="0.9">
    <line x1="512" y1="512" x2="512" y2="290"/>
    <line x1="512" y1="512" x2="320" y2="623"/>
    <line x1="512" y1="512" x2="704" y2="623"/>
  </g>

  <!-- Tres aparatos en la órbita -->
  <g fill="#EAF4FF">
    <circle cx="512" cy="290" r="54"/>
    <circle cx="320" cy="623" r="54"/>
    <circle cx="704" cy="623" r="54"/>
  </g>

  <!-- Núcleo -->
  <circle cx="512" cy="512" r="92" fill="url(#canto)"/>
  <circle cx="512" cy="512" r="40" fill="#0D1118"/>
</svg>
