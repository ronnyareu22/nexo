<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Nexo</title>
    <script>
      // Tema elegido en la app (lib/tema.ts), aplicado antes de pintar para que no parpadee.
      try {
        var t = localStorage.getItem('nexo-tema');
        if (t === 'claro') document.documentElement.dataset.theme = 'light';
        else if (t === 'oscuro') document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>
    %sveltekit.head%
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
